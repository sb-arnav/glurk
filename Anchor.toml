[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
glurk_protocol = "5FVzW7QwuETtRnBfXom3b2Rxd2R6weo1285Fywg66fCQ"

# anchor-bankrun reads programs.localnet to map .so files to program IDs in
# the in-process test bank. Matches devnet so PDAs derive identically.
[programs.localnet]
glurk_protocol = "5FVzW7QwuETtRnBfXom3b2Rxd2R6weo1285Fywg66fCQ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
